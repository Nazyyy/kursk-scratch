<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" style="background:#080a0d; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;">
  <defs>
    <pattern id="grid-sm" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.7"/>
    </pattern>
    <pattern id="grid-lg" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-sm)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="#080a0d"/>
  <rect width="800" height="1000" fill="url(#grid-lg)"/>

  <!-- Border ГОСТ 2.104-2006 -->
  <rect x="30" y="30" width="740" height="940" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.2"/>
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.8" stroke-dasharray="4 4"/>

  <!-- Header Telemetry Block -->
  <g transform="translate(50, 65)" fill="#f1f5f9">
    <text x="0" y="0" font-size="10" letter-spacing="1.5" fill="#ffffff">ОБПОУ «КЭМТ» · УЧАСТОК ПРЕЦИЗИОННОГО ЧПУ</text>
    <text x="0" y="16" font-size="8.5" fill="rgba(255,255,255,0.45)">ЧЕРТЕЖ: КЭМТ-ВВЭР-0492 · РОТОР ПИТАТЕЛЬНОГО НАСОСА</text>
    <text x="540" y="0" font-size="9.5" fill="#ffffff" text-anchor="end">ТОЧНОСТЬ: IT6 [±0.008 мм]</text>
    <text x="540" y="16" font-size="8.5" fill="rgba(255,255,255,0.45)" text-anchor="end">ГОСТ 2.307-2011 // СТАЛЬ 12Х18Н10Т</text>
  </g>

  <!-- Datum Crosshairs -->
  <g stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-dasharray="8 4 2 4">
    <line x1="50" y1="500" x2="750" y2="500"/>
    <line x1="400" y1="100" x2="400" y2="900"/>
    <circle cx="400" cy="500" r="310" fill="none"/>
    <circle cx="400" cy="500" r="240" fill="none"/>
    <circle cx="400" cy="500" r="160" fill="none"/>
    <circle cx="400" cy="500" r="80" fill="none"/>
  </g>

  <!-- Main CAD Drawing: Impeller & Machined Contour -->
  <g transform="translate(400, 500)">
    <circle cx="0" cy="0" r="42" fill="rgba(255,255,255,0.03)" stroke="#ffffff" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="24" fill="#080a0d" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="-6" y="-32" width="12" height="12" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.9" stroke-dasharray="5 3"/>

    <!-- Bolt holes -->
    <circle cx="75" cy="0" r="6" fill="none" stroke="#ffffff" stroke-width="1.1"/>
    <circle cx="-75" cy="0" r="6" fill="none" stroke="#ffffff" stroke-width="1.1"/>
    <circle cx="0" cy="75" r="6" fill="none" stroke="#ffffff" stroke-width="1.1"/>
    <circle cx="0" cy="-75" r="6" fill="none" stroke="#ffffff" stroke-width="1.1"/>
    <circle cx="53" cy="53" r="6" fill="none" stroke="#ffffff" stroke-width="1.1"/>
    <circle cx="-53" cy="53" r="6" fill="none" stroke="#ffffff" stroke-width="1.1"/>
    <circle cx="53" cy="-53" r="6" fill="none" stroke="#ffffff" stroke-width="1.1"/>
    <circle cx="-53" cy="-53" r="6" fill="none" stroke="#ffffff" stroke-width="1.1"/>

    <!-- 12 Aerodynamic Blades -->
    <g stroke="#ffffff" stroke-width="1.6" fill="none">
      <path d="M 42 0 C 80 40 140 70 240 45 C 248 42 250 35 242 32 C 150 48 90 20 40 -12 Z" transform="rotate(0)"/>
      <path d="M 42 0 C 80 40 140 70 240 45 C 248 42 250 35 242 32 C 150 48 90 20 40 -12 Z" transform="rotate(30)"/>
      <path d="M 42 0 C 80 40 140 70 240 45 C 248 42 250 35 242 32 C 150 48 90 20 40 -12 Z" transform="rotate(60)"/>
      <path d="M 42 0 C 80 40 140 70 240 45 C 248 42 250 35 242 32 C 150 48 90 20 40 -12 Z" transform="rotate(90)"/>
      <path d="M 42 0 C 80 40 140 70 240 45 C 248 42 250 35 242 32 C 150 48 90 20 40 -12 Z" transform="rotate(120)"/>
      <path d="M 42 0 C 80 40 140 70 240 45 C 248 42 250 35 242 32 C 150 48 90 20 40 -12 Z" transform="rotate(150)"/>
      <path d="M 42 0 C 80 40 140 70 240 45 C 248 42 250 35 242 32 C 150 48 90 20 40 -12 Z" transform="rotate(180)"/>
      <path d="M 42 0 C 80 40 140 70 240 45 C 248 42 250 35 242 32 C 150 48 90 20 40 -12 Z" transform="rotate(210)"/>
      <path d="M 42 0 C 80 40 140 70 240 45 C 248 42 250 35 242 32 C 150 48 90 20 40 -12 Z" transform="rotate(240)"/>
      <path d="M 42 0 C 80 40 140 70 240 45 C 248 42 250 35 242 32 C 150 48 90 20 40 -12 Z" transform="rotate(270)"/>
      <path d="M 42 0 C 80 40 140 70 240 45 C 248 42 250 35 242 32 C 150 48 90 20 40 -12 Z" transform="rotate(300)"/>
      <path d="M 42 0 C 80 40 140 70 240 45 C 248 42 250 35 242 32 C 150 48 90 20 40 -12 Z" transform="rotate(330)"/>
    </g>

    <path d="M 50 10 A 55 55 0 0 1 120 40 A 130 130 0 0 1 200 90 A 235 235 0 0 1 270 140" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="0.9" stroke-dasharray="3 3"/>

    <circle cx="0" cy="0" r="260" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="275" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.8" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="285" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  </g>

  <!-- Dimension 1: Outer Diameter -->
  <g stroke="rgba(255,255,255,0.65)" stroke-width="0.9" fill="none">
    <line x1="90" y1="500" x2="90" y2="190" stroke-dasharray="3 3"/>
    <line x1="710" y1="500" x2="710" y2="190" stroke-dasharray="3 3"/>
    <line x1="95" y1="200" x2="705" y2="200"/>
    <polygon points="95,197 85,200 95,203" fill="rgba(255,255,255,0.8)"/>
    <polygon points="705,197 715,200 705,203" fill="rgba(255,255,255,0.8)"/>
  </g>
  <rect x="330" y="190" width="140" height="20" fill="#080a0d"/>
  <text x="400" y="204" font-size="11" font-weight="500" fill="#ffffff" text-anchor="middle">Ø 570.0 ±0.012 mm</text>

  <!-- Dimension 2: Bore Diameter -->
  <g stroke="rgba(255,255,255,0.6)" stroke-width="0.9" fill="none">
    <line x1="376" y1="500" x2="376" y2="380" stroke-dasharray="2 2"/>
    <line x1="424" y1="500" x2="424" y2="380" stroke-dasharray="2 2"/>
    <line x1="330" y1="390" x2="470" y2="390"/>
    <polygon points="376,387 366,390 376,393" fill="rgba(255,255,255,0.8)"/>
    <polygon points="424,387 434,390 424,393" fill="rgba(255,255,255,0.8)"/>
  </g>
  <text x="400" y="378" font-size="10" fill="rgba(255,255,255,0.85)" text-anchor="middle">Ø 48 H7 (+0.025)</text>

  <!-- Surface Finish Callout -->
  <g stroke="rgba(255,255,255,0.6)" stroke-width="0.9" fill="none">
    <polyline points="580,420 630,360 720,360"/>
    <circle cx="580" cy="420" r="2.5" fill="#ffffff"/>
  </g>
  <g fill="#ffffff" font-size="9.5" transform="translate(635, 354)">
    <text x="0" y="-12" font-weight="600">ШЕРОХОВАТОСТЬ Ra 0.8</text>
    <text x="0" y="2" fill="rgba(255,255,255,0.6)">ФРЕЗЕРОВАНИЕ 5-AXIS</text>
    <text x="0" y="16" fill="rgba(255,255,255,0.4)">Vc = 145 м/мин</text>
  </g>

  <!-- G-Code Telemetry Block -->
  <g transform="translate(55, 790)">
    <rect x="0" y="0" width="280" height="145" rx="4" fill="rgba(12,14,18,0.92)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <text x="14" y="20" font-size="9" font-weight="600" fill="#ffffff" letter-spacing="1">G-CODE CNC RUNTIME TELEMETRY</text>
    <text x="14" y="38" font-size="8.5" fill="rgba(255,255,255,0.6)">N1020 G00 G90 G54 X0. Y0. Z150. S4800 M03</text>
    <text x="14" y="54" font-size="8.5" fill="rgba(255,255,255,0.6)">N1022 G43 H04 Z25. M08 (COOLANT HI-PRES)</text>
    <text x="14" y="70" font-size="8.5" fill="#ffffff">N1024 G01 Z-14.850 F850. (PROFILE ROUGH)</text>
    <text x="14" y="86" font-size="8.5" fill="rgba(255,255,255,0.6)">N1026 G02 X48.200 Y12.400 R24.0 F1200.</text>
    <text x="14" y="102" font-size="8.5" fill="rgba(255,255,255,0.6)">N1028 G05.1 Q1 (AI NANO ACCELERATION)</text>
    <text x="14" y="126" font-size="8.5" fill="rgba(255,255,255,0.75)">[ ТАКТ 14 // ПОГРЕШНОСТЬ 0.003 мм ]</text>
  </g>

  <!-- Official Stamp Block -->
  <g transform="translate(480, 840)">
    <rect x="0" y="0" width="260" height="95" rx="2" fill="rgba(12,14,18,0.95)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <line x1="0" y1="24" x2="260" y2="24" stroke="rgba(255,255,255,0.12)"/>
    <line x1="0" y1="48" x2="260" y2="48" stroke="rgba(255,255,255,0.12)"/>
    <line x1="0" y1="72" x2="260" y2="72" stroke="rgba(255,255,255,0.12)"/>
    <line x1="85" y1="0" x2="85" y2="95" stroke="rgba(255,255,255,0.12)"/>
    <text x="8" y="16" font-size="8" fill="rgba(255,255,255,0.45)">РАЗРАБОТАЛ</text>
    <text x="95" y="16" font-size="8.5" fill="#ffffff">КЭМТ / ЦОПП 46</text>
    <text x="8" y="40" font-size="8" fill="rgba(255,255,255,0.45)">ПРОВЕРИЛ</text>
    <text x="95" y="40" font-size="8.5" fill="#ffffff">ТЕХНОЛОГ АЭС-2</text>
    <text x="8" y="64" font-size="8" fill="rgba(255,255,255,0.45)">МАТЕРИАЛ</text>
    <text x="95" y="64" font-size="8.5" fill="#ffffff">ВТ6 ТИТАНОВЫЙ СПЛАВ</text>
    <text x="8" y="86" font-size="8" fill="rgba(255,255,255,0.45)">КОНТРОЛЬ</text>
    <text x="95" y="86" font-size="8.5" fill="#ffffff">УЗК / ГОСТ 7512</text>
  </g>
</svg>